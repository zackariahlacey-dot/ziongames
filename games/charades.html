<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#d4a017"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Biblical Charades — True Bible Games</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <style>
    .act-word {
      font-family: var(--font-h);
      font-size: clamp(1.6rem, 7vw, 2.6rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold2) 0%, var(--gold) 60%, #8b5e0a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
      text-align: center;
    }
    .cat-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .timer-ring { transition: stroke-dashoffset 0.1s linear; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <button class="back-btn" onclick="navigateTo('/')" aria-label="Back">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
      </button>
      <span class="header-title">🎭 Biblical Charades</span>
      <div style="width:40px"></div>
    </div>
  </header>

  <main class="page safe-bottom">
    <div id="appRoot"></div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/game-data.js"></script>
  <script src="/js/charades.js"></script>
</body>
</html>
