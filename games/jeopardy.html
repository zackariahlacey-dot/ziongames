<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#d4a017"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Biblical Jeopardy — True Bible Games</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <style>
    /* ── Timer bar (used in question screen) ── */
    .timer-bar {
      height: 10px;
      background: var(--bg3);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .timer-bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.9s linear, background 0.5s;
    }

    /* ── Desktop / Landscape Layout ── */
    @media (min-width: 900px) {
      /* Full-screen dark background */
      body { background: var(--bg); }

      /* Header goes full-width */
      .app-header-inner { max-width: 100%; padding: 0 2rem; }

      /* Main layout becomes a side-by-side two-column */
      .jp-desktop-layout {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 1.5rem;
        align-items: start;
        max-width: 1400px;
        margin: 0 auto;
        padding: 1.5rem 2rem;
      }

      /* Board fills the left column */
      .jeopardy-board-wrap {
        width: 100%;
      }

      /* Score sidebar on the right */
      .jp-score-sidebar {
        position: sticky;
        top: 80px;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      /* Bigger cells on desktop */
      .jeopardy-cell {
        min-height: 72px;
        font-size: 1.4rem;
      }
      .jeopardy-cell.header {
        min-height: 56px;
        font-size: 0.85rem;
      }

      /* Question screen — centered card */
      .jp-question-desktop {
        max-width: 700px;
        margin: 2rem auto;
      }

      /* Setup screen centered */
      .jp-setup-wrap {
        max-width: 600px;
        margin: 0 auto;
      }
    }

    /* Force landscape hint on tablets in portrait */
    @media (max-width: 899px) and (orientation: portrait) and (min-width: 600px) {
      .jp-landscape-hint {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--gold-dim);
        border: 1px solid var(--border2);
        border-radius: var(--r-sm);
        padding: 0.6rem 1rem;
        margin-bottom: 1rem;
        font-size: 0.8rem;
        color: var(--gold2);
      }
    }
    @media (min-width: 900px), (orientation: landscape) {
      .jp-landscape-hint { display: none !important; }
    }
    @media (max-width: 599px) {
      .jp-landscape-hint { display: none !important; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <button class="back-btn" onclick="navigateTo('/')" aria-label="Back">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
      </button>
      <span class="header-title">⭐ Jeopardy</span>
      <button class="header-action" onclick="showScoreEdit()" title="Scores">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2zm0 0V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v10m-6 0a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="page safe-bottom" id="appRoot"></main>

  <script src="/js/app.js"></script>
  <script src="/js/game-data.js"></script>
  <script src="/js/scoreboard.js"></script>
  <script src="/js/jeopardy.js"></script>
</body>
</html>
