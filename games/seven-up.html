<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#d4a017"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Heads Up Seven Up — True Bible Games</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <style>
    .heads-down-screen {
      background: linear-gradient(135deg, rgba(15,15,25,0.98) 0%, rgba(30,20,50,0.98) 100%);
      min-height: 100vh;
    }
    .disciple-chip {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.85rem;
      background: rgba(212,160,23,0.08);
      border: 1px solid rgba(212,160,23,0.25);
      border-radius: var(--r-sm);
    }
    .player-select-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      cursor: pointer;
      color: var(--text);
      font-size: 0.9rem;
      transition: all 0.15s;
    }
    .player-select-btn.pressed {
      background: rgba(212,160,23,0.12);
      border-color: rgba(212,160,23,0.4);
      color: var(--gold2);
    }
    .player-select-btn.standing {
      background: rgba(74,222,128,0.08);
      border-color: rgba(74,222,128,0.3);
      color: var(--green);
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <button class="back-btn" onclick="navigateTo('/')" aria-label="Back">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
      </button>
      <span class="header-title">👍 Heads Up Seven Up</span>
      <div style="width:40px"></div>
    </div>
  </header>

  <main class="page safe-bottom">
    <div id="appRoot"></div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/game-data.js"></script>
  <script src="/js/seven-up.js"></script>
</body>
</html>
