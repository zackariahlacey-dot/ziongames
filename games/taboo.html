<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#d4a017"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Biblical Taboo — Zion Games</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <style>
    .taboo-word {
      font-family: var(--font-h);
      font-size: clamp(2rem, 9vw, 3.2rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold2) 0%, var(--gold) 60%, #8b5e0a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.15;
      text-align: center;
    }
    .forbidden-word {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 1rem;
      background: rgba(248,113,113,0.07);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: var(--r-sm);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      transition: var(--trans);
      position: relative;
      overflow: hidden;
    }
    .forbidden-word.buzzed {
      background: rgba(248,113,113,0.2);
      border-color: rgba(248,113,113,0.6);
      color: var(--red);
      text-decoration: line-through;
    }
    .forbidden-word::before {
      content: '⚡';
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .action-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .action-bar .btn-buzz {
      grid-column: 1 / -1;
    }
    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .timer-bar {
      height: 5px;
      background: var(--bg3);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .timer-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.9s linear, background 0.5s;
    }
    .turn-summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.85rem;
      border-radius: var(--r-sm);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <button class="back-btn" onclick="confirmQuit()" aria-label="Back">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
      </button>
      <span class="header-title" id="headerTitle">📖 Biblical Taboo</span>
      <div style="width:40px"></div>
    </div>
  </header>

  <main class="page safe-bottom" id="appRoot"></main>

  <script src="/js/app.js"></script>
  <script src="/js/game-data.js"></script>
  <script src="/js/scoreboard.js"></script>
  <script src="/js/taboo.js"></script>
</body>
</html>
