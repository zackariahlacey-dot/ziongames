<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#d4a017"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Bible Heads Up — True Bible Games</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <style>
    #huGameWrap {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 56px);
      overflow: hidden;
      position: relative;
    }
  </style>
</head>
<body>
  <header class="app-header" id="appHeader">
    <div class="app-header-inner">
      <button class="back-btn" onclick="huHandleBack()" aria-label="Back">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
      </button>
      <span class="header-title">🤔 Bible Heads Up</span>
      <div style="width:40px"></div>
    </div>
  </header>

  <main class="page safe-bottom" style="padding:0;overflow:hidden;">
    <div id="appRoot"></div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/game-data.js"></script>
  <script src="/js/heads-up.js"></script>
</body>
</html>
